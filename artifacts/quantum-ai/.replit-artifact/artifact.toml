kind = "web"
previewPath = "/"
title = "Quantum AI Engine"
version = "1.0.0"
id = "artifacts/quantum-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19773

[services.development]
run = "pnpm --filter @workspace/quantum-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/quantum-ai", "run", "build" ]
publicDir = "artifacts/quantum-ai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19773"
BASE_PATH = "/"
